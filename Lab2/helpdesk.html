<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="description" content="Creating Web App">
        <meta name="keywords" content="HTML, CSS, Javascript">
        <meta name="author" content="Daniel D">
        <title>CWA Help Desk Appointment</title>
    </head>

    <body>
        <a href="http://www.swin.edu.au/"><img src="lab02/logo.png" alt="Swinburne Logo"></a>
        <h1>CWA Help Desk Appointment</h1>
        <form method="post" action="https://mercury.swin.edu.au/it000000/formtest.php">

            <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday.</p>
            <p>Check Blackboard for when CWA tutors will be there.</p>

            <fieldset>
                <legend>Student details</legend>
                <p>
                    <label for="id">Student ID</label>
                    <input type="text" name="id" id="id" required="required" pattern="(\d){7,10}" maxlength="10" size="10">
                </p>
                <p>
                    <label for="gname">Given Name</label>
                    <input type="text" name="gname" id="gname" required="required" maxlength="15" pattern="[A-za-z]+" size="15">
                    <label for="fname">Family Name</label>
                    <input type="text" name="fname" id="fname" required="required" maxlength="15" pattern="[A-za-z]+" size="15">
                </p>
            </fieldset>

            <fieldset>
                <legend>Your unit</legend>
                <p>
                    <input type="radio" id="cos10011" name="unit" value="cos10011" required="required">
                    <label for="cos10011">COS10011</label>

                    <input type="radio" id="cos60004" name="unit" value="cos60004">
                    <label for="cos60004">COS60004</label>

                    <input type="radio" id="cos60007" name="unit" value="cos60007">
                    <label for="cos60007">COS60007</label>
                </p>
                <p>
                    <label for="tutor">Your Tutor</label>
                    <select name="tutor" id="tutor" required="required">
                        <option value="">Please select</option>
                        <option value="abeet">Amerigo Beet</option>
                        <option value="ecoode">Emmet Coode</option>
                        <option value="dhernaman">Delaney Hearnaman</option>
                    </select>
                </p>
            </fieldset>

            <fieldset>
                <legend>Issue</legend>

                <p>
                    <label for="html">HTML</label>
                    <input type="checkbox" id="html" name="issue[]" value="html" checked="checked">

                    <label for="css">CSS</label>
                    <input type="checkbox" id="css" name="issue[]" value="css">

                    <label for="js">JavaScript</label>
                    <input type="checkbox" id="js" name="issue[]" value="js">

                    <label for="php">PHP</label>
                    <input type="checkbox" id="php" name="issue[]" value="php">

                    <label for="mysql">MySQL</label>
                    <input type="checkbox" id="mysql" name="issue[]" value="mysql">
                </p>
                <p>
                    <label for="description">Description of Issue</label><br>
                    <textarea name="description" id="description" cols="40" rows="4" placeholder="Write description of your problem here..."></textarea>
                </p>
            </fieldset>

            <fieldset>
                <legend>Preferred Date/Time</legend>
                
                <label for="date">Date</label>
                <input type="date" name="date" id="date" size="10"><br>

                <label for="time">Time</label>
                <input type="text" name="time" id="time" pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]" placeholder="00:00">
                
            </fieldset>
            <input type="submit" value="Book">
            <input type="reset" value="Reset">
        </form>
    </body>
</html>
