        <main>
            <h1>Product Enquiry</h1>
            <form method="post" action="https://mercury.swin.edu.au/it000000/formtest.php">
                <label for="fname">First Name <input type="text" name="fname" id="fname" pattern="[A-za-z]+" maxlength="25" required="required"></label>
                

                <label for="lname">Last Name <input type="text" name="lname" id="lname" pattern="[A-za-z]+" maxlength="25" required="required"></label>

                <label for="emailaddr">Email <input type="email" name="emailaddr" id="emailaddr"></label>
                

                <fieldset>
                    <legend>Address</legend>
                    <p>
                        <label for="street_addr">Street Address <input type="text" name="stresst_addr" id="street_addr" maxlength="40" pattern="([A-za-z]|[0-9]|\ )+" required="required"></label>
                    </p>

                    <p>
                        <label for="suburb">Surburb <input type="text" name="suburb" id="suburb" maxlength="20" pattern="([A-za-z]|[0-9]|\ )+" required="required"></label>
                        

                        <label for="state">
                            State <select name="state" id="state">
                                <option value="vic" selected="selected">VIC</option>
                                <option value="nsw">NSW</option>
                                <option value="qld">QLD</option>
                                <option value="nt">NT</option>
                                <option value="wa">WA</option>
                                <option value="tas">TAS</option>
                                <option value="act">ACT</option>
                            </select>
                        </label>

                        <label for="postcode">Postcode <input type="text" id="postcode" name="postcode" maxlength="4" size="4" pattern="[0-9]{4}" required="required"></label>
                        
                    </p>
                </fieldset>

                <label for="phonenum">Phone Number <input type="text" name="phonenum" id="phonenum" placeholder="00 0000 0000" pattern="[0-9]+" maxlength="10" required="required"></label>
                

                <p>
                    Preferred contact

                    
                    <label for="email"><input type="radio" name="pcontact" id="email" value="email" required="required">Email</label>

                    
                    
                    <label for="post"><input type="radio" name="pcontact" id="post" value="post">Post</label>

                    
                    
                    <label for="phone"><input type="radio" name="pcontact" id="phone" value="phone">Phone</label>

                </p>

                <p>
                    <label for="product">
                        Product <select name="product" id="product">
                            <option value="OK-M" selected="selected">OK-M</option>
                            <option value="OneX">One X</option>
                            <option value="One3">One 3</option>
                        </select>
                    </label>
                </p>

                <p>
                    Product Feature

                    
                    <label for="switches"><input type="checkbox" name="feature[]" id="switches" value="switches"  required="required">Hot-Swappable Switches</label>

                    
                    <label for="connectivity"><input type="checkbox" name="feature[]" id="connectivity" value="connectivity">Connectivity</label>

                    
                    <label for="via"><input type="checkbox" name="feature[]" id="via" value="via">VIA</label>
                </p>

                <p>
                    <label for="comment">Comment</label><br>
                    <textarea name="comment" id="comment"></textarea>
                </p>

                <p>
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </p>
            </form>
